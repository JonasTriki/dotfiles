version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  apply:
    desc: Apply the dotfiles to $HOME
    cmds:
      - chezmoi apply

  diff:
    desc: Show what `task apply` would change
    cmds:
      - chezmoi diff

  brew:
    desc: Install the Brewfile and Brewfile.private
    cmds:
      - ./scripts/brew.sh

  update:
    desc: Update packages, zsh plugins, Oh My Zsh and runtimes
    cmds:
      - task: brew
      - chezmoi apply --refresh-externals
      - mise upgrade
      - zsh -ic 'omz update'

  macos:
    desc: Apply macOS defaults
    cmds:
      - ./scripts/macos.sh

  fresh:
    desc: Bootstrap a new Mac
    cmds:
      - ./scripts/fresh.sh
